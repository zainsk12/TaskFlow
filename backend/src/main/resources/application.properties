spring.application.name=backend

# --- Server ---
# Bind to the platform-provided port in production (Render injects $PORT); fall
# back to 8080 for local development.
server.port=${PORT:8080}

# --- JWT (stateless auth) ---
# HS256 signing secret. MUST be >= 256 bits (32 chars). Override in real
# environments via the JWT_SECRET env var; never commit a production secret.
jwt.secret=${JWT_SECRET:change-me-dev-only-secret-please-rotate-0123456789abcdef}
# Short-lived access token; expiresIn is reported to clients in seconds (15m -> 900).
jwt.access-token-expiration=15m
# Longer-lived refresh token.
jwt.refresh-token-expiration=7d

# --- Refresh-token cookie ---
# Locally the Vite dev server proxies /api to this backend, so the browser sees
# a same-origin request and Lax/non-secure works over plain HTTP. In production
# (Vercel frontend + Render backend) the cookie is cross-site, so it must be
# Secure with SameSite=None — set COOKIE_SECURE=true and COOKIE_SAME_SITE=None
# in the deployment environment.
app.refresh-cookie.secure=${COOKIE_SECURE:false}
app.refresh-cookie.same-site=${COOKIE_SAME_SITE:Lax}

# --- Rate limiting (auth endpoints, Issue #3) ---
# In-memory, per-instance fixed-window limiter (see RateLimitFilter/RateLimiter)
# keyed by client IP + endpoint. NOT shared across multiple backend instances.
# Disable entirely for local dev/testing with RATE_LIMIT_ENABLED=false.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.window=${RATE_LIMIT_WINDOW:1m}
app.rate-limit.login-max-requests=${RATE_LIMIT_LOGIN_MAX:5}
app.rate-limit.register-max-requests=${RATE_LIMIT_REGISTER_MAX:5}
app.rate-limit.refresh-max-requests=${RATE_LIMIT_REFRESH_MAX:10}
# Render sits in front of this app as a reverse proxy. NATIVE makes embedded
# Tomcat trust X-Forwarded-For from that immediate upstream to resolve
# request.getRemoteAddr() to the real client IP, which the rate limiter keys
# on — without it, every request would appear to come from Render's edge and
# share one bucket.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# --- MongoDB ---
# Auto index creation is intentionally left OFF (the default). The @Indexed /
# @CompoundIndex declarations document the intended indexes (docs/DATABASE.md §2-4)
# and are applied by clean environments / deploy scripts; uniqueness (email,
# category name per user) is enforced at the service layer. Enabling it here would
# conflict with pre-existing indexes on the dev database (e.g. users.email_1).
# NOTE: Spring Boot 4.x renamed this key from `spring.data.mongodb.uri` to
# `spring.mongodb.uri` (the old key is deprecated at error level and is NOT bound,
# so it is silently ignored and the driver falls back to localhost:27017).
# The connection string (which contains Atlas credentials) is supplied via the
# MONGODB_URI environment variable and is never committed. For local development,
# export MONGODB_URI (e.g. your Atlas SRV string) or run a local mongod; if unset
# it falls back to a local instance. See .env.example and docs/DEPLOYMENT.md.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/taskflow}

# --- Pagination (list endpoints) ---
# Default page size 20, hard cap 100 (docs/API_SPEC.md §1.4).
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
