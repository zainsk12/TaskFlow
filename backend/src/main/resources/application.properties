spring.application.name=backend

# --- Temporary: defer Spring Security's default web protection (Phase 5A) ---
# spring-boot-starter-security is on the classpath, so by default every endpoint
# is locked behind HTTP Basic with a generated password. Until the JWT phase
# introduces a real SecurityConfig, exclude the servlet web-security auto-config
# so the public /api/v1/auth/** endpoints (and the rest of the API) are reachable.
# The BCryptPasswordEncoder bean (PasswordConfig) is unaffected by this.
# TODO(jwt): remove this once SecurityConfig defines the stateless filter chain.
spring.autoconfigure.exclude=\
  org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration
