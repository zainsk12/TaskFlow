# =============================================================================
# Render Blueprint — TaskFlow Backend
# Java 21 + Spring Boot + MongoDB Atlas
# =============================================================================

services:
  - type: web
    name: taskflow-backend
    runtime: docker

    # Docker configuration
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Render plan and region
    plan: free
    region: oregon

    # Health check
    healthCheckPath: /health

    # Automatically deploy when changes are pushed to the connected branch
    autoDeploy: true

    # Secrets and environment-specific values are intentionally NOT stored
    # in this file. Configure them in the Render dashboard.
    envVars:
      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Refresh-token cookie settings
      - key: COOKIE_SECURE
        value: "true"

      - key: COOKIE_SAME_SITE
        value: "None"

      # Rate limiting
      - key: RATE_LIMIT_ENABLED
        value: "true"

      - key: RATE_LIMIT_WINDOW
        value: "1m"

      - key: RATE_LIMIT_LOGIN_MAX
        value: "5"

      - key: RATE_LIMIT_REGISTER_MAX
        value: "5"

      - key: RATE_LIMIT_REFRESH_MAX
        value: "10"

      # Trust Render's reverse proxy for client IP detection
      - key: FORWARD_HEADERS_STRATEGY
        value: "native"